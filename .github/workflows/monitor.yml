name: BOOKOFF stock monitor

on:
  schedule:
    # 10-minute interval, offset from the top of the hour to reduce scheduler congestion.
    - cron: "3,13,23,33,43,53 * * * *"
  workflow_dispatch:
    inputs:
      test_notification:
        description: "Send a Discord test notification without checking BOOKOFF"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: bookoff-stock-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Validate Discord secret
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "Repository secret DISCORD_WEBHOOK_URL is missing." >&2
            exit 1
          fi

      - name: Run parser tests
        run: python -m unittest discover -s tests -v

      - name: Check stock
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          TEST_NOTIFICATION: ${{ inputs.test_notification }}
        run: |
          if [ "$TEST_NOTIFICATION" = "true" ]; then
            python monitor.py --test-notification
          else
            python monitor.py
          fi
